<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교통사고 뉴스</title>
    <style>
        /* 기본 스타일 */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #faf8f8, #b8b6b6);
            margin: 0;
            padding: 0;
            color: #000000;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* iframe 스타일 */
        iframe {
            width: 90%;
            height: 80vh;
            border: none;
            box-shadow: 0 4px 8px rgba(139, 88, 88, 0.2);
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        /* iframe 호버 시 애니메이션 */
        iframe:hover {
            transform: scale(1.02);
        }

        /* 헤더 스타일 */
        header {
            background-color: rgba(255, 255, 255, 0.7);
            padding: 20px 0;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        /* 페이지 바닥 스타일 */
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            color: rgb(0, 0, 0);
            padding: 10px;
            text-align: center;
            font-size: 1rem;
        }

        footer a {
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            margin-left: 10px;
        }

        footer a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <!-- 헤더 추가 -->
    <header>
        <h1>교통사고 뉴스</h1>
        <p>최신 교통사고 데이터를 확인해보세요.</p>
    </header>

    <!-- iframe 콘텐츠 -->
    <iframe src="http://127.0.0.1:5000/"></iframe>

    <!-- 푸터 -->
    <footer>
        <p>&copy; 2025 교통사고 뉴스 | <a href="http://127.0.0.1:8080">처음화면으로</a></p>
    </footer>

</body>
</html>
